# How an/an03.dat reaches object registry 1 in Kamiki, and what a room change and a soft reset do to it.
# In game: enter Kamiki, leave, come back, then soft-reset.
ring 262144
limit captures 10

probe AllocRequest if path ~ "an03"
probe CompleteRequest if path ~ "an03"
probe ObjResRegistry_Preload if objId == 0x503
probe ObjResRegistry_IsResident if objId == 0x503
probe ObjResSlot_RegisterWithMemTracker if objId == 0x503
probe ObjResRegistry_ForceRelease if objId == 0x503
probe ObjResSlot_FreeAndMarkDestroyed
probe ResourceFixup_WalkContainer
probe ResourceFixup_TextureChunk
probe GXTextureManager_AllocSlotAndLoadDDS
probe GXTextureManager_FreeCategory
probe GXTextureManager_FreeAllButCategory0
probe SoftReset_ExecuteAndReload
probe room.change
watch mapstate main!0x180b661d0 1

# The file as loaded, decrypted, with registry 1 around it.
trigger an03-loaded
  on CompleteRequest if decrypt == 1
  save 4
  window 30 240
  snapshot file buffer size runofs
  snapshot reg1 main!0x180899fb0 0x20 objres.registry
  snapshot reg1.slots main!0x1808996b0 0x900 objres.slots
end

trigger an03-released
  on ObjResRegistry_ForceRelease
  save 4
  window 240 60
  snapshot reg1.slots main!0x1808996b0 0x900 objres.slots
end

trigger reset
  on SoftReset_ExecuteAndReload
  save 2
  window 120 300
  snapshot reg1.slots main!0x1808996b0 0x900 objres.slots
end
