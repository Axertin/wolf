# Whether the default heap survives a soft reset: the heap-clearing calls during the reset, and the allocations on either side of it.
# In game: play for a minute, then soft-reset twice.
ring 1048576

probe _MemoryAlloc
probe _MemoryFree
probe _MemoryFreeHeap
probe cHeap::clear
probe cHeapExpandable::clear
probe cHeapExtended::clear
probe cHeap::destroy
probe cHeapExpandable::destroy
probe SoftReset_ExecuteAndReload
probe GXTextureManager_FreeAllButCategory0

trigger reset
  on SoftReset_ExecuteAndReload
  save 2
  window 120 300
  snapshot default-heap [[main!0x180671358]] 0x180
  snapshot reg1.slots main!0x1808996b0 0x900 objres.slots
end
