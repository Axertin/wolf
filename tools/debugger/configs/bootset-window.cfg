# The PreloadBootSet window at cold boot, against the same window after a soft reset.
# In game: start the game, load a save, then soft-reset twice.
ring 262144

probe ObjResRegistry_PreloadBootSet
probe ObjResRegistry_InsertPinned
probe ObjResRegistry_Preload
probe AllocRequest
probe CompleteRequest
probe SoftReset_ExecuteAndReload
probe room.change
watch mapstate main!0x180b661d0 1

trigger bootset
  on ObjResRegistry_PreloadBootSet.return
  save 3
  window 600 60
  snapshot reg0 main!0x180799b00 0x20 objres.registry
  snapshot reg0.slots main!0x1808972b0 0x2400 objres.slots
  snapshot reg1 main!0x180899fb0 0x20 objres.registry
  snapshot reg1.slots main!0x1808996b0 0x900 objres.slots
end
